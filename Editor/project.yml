name: AdaEditor
options:
  bundleIdPrefix: org.adaengine
  fileTypes:
    "icon":
      file: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  AdaEditor:
    path: .
targets:
  AdaEditorUpdater:
    type: framework
    platform: macOS
    sources:
      - path: Platforms/StandaloneUpdater/EditorSparkleUpdater.swift
      - path: Sources/AdaEditor/Updates/EditorUpdateBridge.swift
    info:
      path: Platforms/StandaloneUpdater/Framework-Info.plist
      properties:
        NSPrincipalClass: AdaEditorSparkleUpdater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.adaengine.editor.updater
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Sparkle
        product: Sparkle
  AdaEditor-macOS:
    attributes:
      SystemCapabilities:
        com.apple.GameCenter:
          enabled: 1
    entitlements:
      path: Platforms/AdaEditor-macOS.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    type: application
    platform: macOS
    sources:
      - path: ../Assets/AdaEngine.icon
        buildPhase: resources
        group: Assets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AdaEngine
        PRODUCT_NAME: AdaEngine
        PRODUCT_BUNDLE_IDENTIFIER: org.adaengine.editor
        ADA_CLOUD_API_URL: ""
        ADA_CLOUD_PRO_PRODUCT_ID: ""
        INFOPLIST_FILE: Sources/AdaEditor/Platforms/macOS/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: true
        ADAEDITOR_DISTRIBUTION: appStore
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
    dependencies:
      - package: AdaEditor
        product: AdaEditor
    postBuildScripts:
      - name: Stage SwiftPM executable
        shell: /bin/zsh
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          source_binary="${BUILT_PRODUCTS_DIR}/AdaEditor"
          destination_binary="${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
          source_resources="${BUILT_PRODUCTS_DIR}/AdaEditor_AdaEditor.bundle"
          destination_resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AdaEditor_AdaEditor.bundle"

          if [[ ! -x "${source_binary}" ]]; then
            echo "error: SwiftPM executable not found at ${source_binary}" >&2
            exit 1
          fi
          if [[ ! -d "${source_resources}" ]]; then
            echo "error: SwiftPM resource bundle not found at ${source_resources}" >&2
            exit 1
          fi

          mkdir -p "${destination_binary:h}"
          /usr/bin/ditto "${source_binary}" "${destination_binary}"
          /bin/chmod +x "${destination_binary}"
          mkdir -p "${destination_resources:h}"
          /usr/bin/ditto "${source_resources}" "${destination_resources}"
  AdaEditor-Standalone:
    type: application
    platform: macOS
    sources:
      - path: ../Assets/AdaEngine.icon
        buildPhase: resources
        group: Assets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AdaEngine
        PRODUCT_NAME: AdaEngine
        PRODUCT_BUNDLE_IDENTIFIER: org.adaengine.editor
        ADA_CLOUD_API_URL: ""
        ADA_CLOUD_PRO_PRODUCT_ID: ""
        INFOPLIST_FILE: Platforms/StandaloneUpdater/App-Info.plist
        ADAEDITOR_UPDATE_FEED_URL: "https://adaengine.org/updates/appcast.xml"
        ADAEDITOR_UPDATE_PUBLIC_KEY: "781F/fu+H9L/exraMYgHhHh2/+tm1NfJLXMG+JQWOcc="
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: true
        ADAEDITOR_DISTRIBUTION: standalone
        CODE_SIGN_ENTITLEMENTS: Platforms/AdaEditor-Standalone.entitlements
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
    dependencies:
      - target: AdaEditorUpdater
        embed: true
        link: false
      - package: Sparkle
        product: Sparkle
      - package: AdaEditor
        product: AdaEditor
    postBuildScripts:
      - name: Stage SwiftPM executable
        shell: /bin/zsh
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          source_binary="${BUILT_PRODUCTS_DIR}/AdaEditor"
          destination_binary="${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
          source_resources="${BUILT_PRODUCTS_DIR}/AdaEditor_AdaEditor.bundle"
          destination_resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AdaEditor_AdaEditor.bundle"

          if [[ ! -x "${source_binary}" ]]; then
            echo "error: SwiftPM executable not found at ${source_binary}" >&2
            exit 1
          fi
          if [[ ! -d "${source_resources}" ]]; then
            echo "error: SwiftPM resource bundle not found at ${source_resources}" >&2
            exit 1
          fi

          mkdir -p "${destination_binary:h}"
          /usr/bin/ditto "${source_binary}" "${destination_binary}"
          /bin/chmod +x "${destination_binary}"
          mkdir -p "${destination_resources:h}"
          /usr/bin/ditto "${source_resources}" "${destination_resources}"
  AdaEditor-iPadOS:
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.GameCenter:
          enabled: 1
    entitlements:
      path: Platforms/AdaEditor.entitlements
      properties:
        com.apple.developer.game-center: true
    type: application
    platform: iOS
    sources:
      - path: ../Assets/AdaEngine.icon
        buildPhase: resources
        group: Assets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AdaEngine
        PRODUCT_NAME: AdaEngine
        PRODUCT_BUNDLE_IDENTIFIER: org.adaengine.editor
        ADA_CLOUD_API_URL: ""
        ADA_CLOUD_PRO_PRODUCT_ID: ""
        INFOPLIST_FILE: Sources/AdaEditor/Platforms/iOS/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: false
    dependencies:
      - package: AdaEditor
        product: AdaEditor
    postBuildScripts:
      - name: Stage SwiftPM executable
        shell: /bin/zsh
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          source_binary="${BUILT_PRODUCTS_DIR}/AdaEditor"
          destination_binary="${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
          source_resources="${BUILT_PRODUCTS_DIR}/AdaEditor_AdaEditor.bundle"
          destination_resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AdaEditor_AdaEditor.bundle"

          if [[ ! -x "${source_binary}" ]]; then
            echo "error: SwiftPM executable not found at ${source_binary}" >&2
            exit 1
          fi
          if [[ ! -d "${source_resources}" ]]; then
            echo "error: SwiftPM resource bundle not found at ${source_resources}" >&2
            exit 1
          fi

          mkdir -p "${destination_binary:h}"
          /usr/bin/ditto "${source_binary}" "${destination_binary}"
          /bin/chmod +x "${destination_binary}"
          mkdir -p "${destination_resources:h}"
          /usr/bin/ditto "${source_resources}" "${destination_resources}"
  AdaPlayer-iOS:
    type: application
    platform: iOS
    sources:
      - path: ../Assets/AdaEngine.icon
        buildPhase: resources
        group: Assets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AdaEngine
        PRODUCT_NAME: AdaPlayer
        PRODUCT_BUNDLE_IDENTIFIER: org.adaengine.player
        ADA_CLOUD_API_URL: ""
        ADA_CLOUD_PRO_PRODUCT_ID: ""
        INFOPLIST_FILE: Platforms/AdaPlayer-Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    dependencies:
      - package: AdaEditor
        product: AdaEditor
    postBuildScripts:
      - name: Stage SwiftPM executable
        shell: /bin/zsh
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          source_binary="${BUILT_PRODUCTS_DIR}/AdaEditor"
          destination_binary="${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
          source_resources="${BUILT_PRODUCTS_DIR}/AdaEditor_AdaEditor.bundle"
          destination_resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AdaEditor_AdaEditor.bundle"

          if [[ ! -x "${source_binary}" ]]; then
            echo "error: SwiftPM executable not found at ${source_binary}" >&2
            exit 1
          fi
          if [[ ! -d "${source_resources}" ]]; then
            echo "error: SwiftPM resource bundle not found at ${source_resources}" >&2
            exit 1
          fi

          mkdir -p "${destination_binary:h}"
          /usr/bin/ditto "${source_binary}" "${destination_binary}"
          /bin/chmod +x "${destination_binary}"
          mkdir -p "${destination_resources:h}"
          /usr/bin/ditto "${source_resources}" "${destination_resources}"
schemes:
  AdaEditor-macOS:
    build:
      targets:
        AdaEditor-macOS: all
    run:
      config: Release
      executable: AdaEditor-macOS
  AdaEditor-Distribution:
    build:
      targets:
        AdaEditor-macOS: all
    run:
      config: Release
      executable: AdaEditor-macOS
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
  AdaEditor-iPadOS:
    build:
      targets:
        AdaEditor-iPadOS: all
    run:
      config: Debug
      executable: AdaEditor-iPadOS
    archive:
      config: Release
  AdaEditor-Standalone:
    build:
      targets:
        AdaEditor-Standalone: all
    run:
      config: Release
      executable: AdaEditor-Standalone
    archive:
      config: Release
  AdaPlayer-iOS:
    build:
      targets:
        AdaPlayer-iOS: all
    run:
      config: Debug
      executable: AdaPlayer-iOS
    archive:
      config: Release
