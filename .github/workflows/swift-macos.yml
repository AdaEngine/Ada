name: SwiftPM Test on macOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  macOS:
    name: macOS 26 with Xcode ${{ matrix.xcode_version }}
    strategy:
      matrix:
        xcode_version: ['26.6']
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode_version }}.app
      ADAENGINE_SKIP_WEBGPU_PLUGINS: "1"
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Swift Version
          run: swift -version

        - name: Test Studio installation
          run: python3 script/test_install_studio_macos.py

        - name: Test
          run: swift test --parallel

        - name: Test Mesh Terrain authoring kernel
          env:
            ADAENGINE_HEADLESS: "1"
          run: swift test --traits MeshTerrainAuthoring --parallel --filter "MeshTerrain|TriangleBoolean|TriangleIndexEdges"
