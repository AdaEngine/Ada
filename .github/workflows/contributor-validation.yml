name: Contributor validation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Workflow tools (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-26, ubuntu-24.04]
        python: ['3.12']
        include:
          - os: ubuntu-24.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation tools explicitly
        if: matrix.python != '3.9'
        run: python -m pip install -r script/contribution-requirements.txt
      - name: Exercise workflow tooling through the shared runner
        if: matrix.python != '3.9'
        run: python script/check_contribution.py check --files .agents/validation.json
      - name: Verify the standard-library runner on minimum Python
        if: matrix.python == '3.9'
        run: python script/test_contribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contributor-tools-${{ matrix.os }}-${{ matrix.python }}
          path: .build-tools/contribution/
          if-no-files-found: ignore

  quality:
    name: Applicable contributor checks
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools explicitly
        run: python -m pip install -r script/contribution-requirements.txt
      - name: Determine actual changed paths
        id: scope
        run: python script/check_contribution.py ci-files --output .build-tools/contribution/ci-paths.json
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.scope.outputs.swift == 'true'
        with:
          xcode-version: '26.6'
      - name: Install SwiftLint
        if: steps.scope.outputs.swift == 'true'
        run: brew install swiftlint
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.web == 'true'
        with:
          package_json_file: Editor/WebUI/package.json
      - name: Install frontend dependencies
        if: steps.scope.outputs.web == 'true'
        working-directory: Editor/WebUI
        run: pnpm install --frozen-lockfile
      - name: Run the actual applicable profile
        run: python script/check_contribution.py check --files-from .build-tools/contribution/ci-paths.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contributor-quality
          path: .build-tools/contribution/
          if-no-files-found: ignore

  gate:
    name: Contributor gate
    if: always()
    needs: [tooling, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job
        env:
          TOOLING_RESULT: ${{ needs.tooling.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$TOOLING_RESULT" = success
          test "$QUALITY_RESULT" = success
