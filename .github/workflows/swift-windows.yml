name: SwiftPM Test on Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

defaults:
    run:  # Use powershell because bash is not supported: https://github.com/compnerd/gha-setup-swift/issues/18#issuecomment-1705524890
        shell: pwsh

jobs:
  Windows:
    name: Windows with SwiftPM
    # Swift 6.2.3 ships Clang 19, while the Visual Studio 2026 STL on
    # windows-latest requires Clang 20 or newer.
    runs-on: windows-2022
    env:
      ADAENGINE_HEADLESS: "1"
      ADAENGINE_SKIP_WEBGPU_PLUGINS: "1"
    steps:
        - name: Setup
          uses: compnerd/gha-setup-swift@v0.2.3
          with:
            branch: swift-6.2.3-release
            tag: 6.2.3-RELEASE
        - name: Checkout
          uses: actions/checkout@v4

        - name: Swift Version
          run: swift -version

        - name: Test
          # Swift Testing 6.2.3 on Windows becomes unstable when all tests are
          # scheduled at once. Keep bounded parallelism so the suite still
          # makes progress without exhausting the runner.
          # Build the test product directly: SwiftPM otherwise compiles the
          # WASI-only JavaScriptKit command plugin, which cannot build on Windows.
          run: |
            swift build -j 2 --product AdaEnginePackageTests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            swift build -j 2 --product TextureAtlasBuilderTool
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            swift test --skip-build --parallel --num-workers 2

        - name: Test Mesh Terrain authoring kernel
          # Authoring is optional for compiled players; explicitly exercise it in CI.
          run: |
            swift build -j 2 --traits MeshTerrainAuthoring --product AdaEnginePackageTests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            swift test --traits MeshTerrainAuthoring --skip-build --parallel --num-workers 2 --filter "MeshTerrain|TriangleBoolean|TriangleIndexEdges"
