name: Shader Graph Apple validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Editor/**'
      - 'Plugins/AdaShaderGraphBaker/**'
      - 'Plugins/AdaWebExportPlugin/**'
      - 'Tests/**'
      - 'script/shader_graph*'
      - 'script/web_golden_saga.mjs'
      - '.github/workflows/shader-graph-apple.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shader-graph-apple-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: ${{ matrix.check }} with Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [cpu-baker, saga-default, metal-native, ipad-simulator, studio-web]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
      ADAENGINE_PACKAGE_PATH: ${{ github.workspace }}/AdaEngine
      ADAENGINE_GRAVITY_PACKAGE_PATH: ${{ github.workspace }}/AdaEngine/Sources/gravity-lang
      ADA_MCP_LOCAL_PATH: ${{ github.workspace }}/.build-tools/apple-mcp
      ADAENGINE_SKIP_SWIFTLINT: '1'
    steps:
      # AdaMCP's local dependency uses the checkout directory as its SwiftPM identity.
      - uses: actions/checkout@v4
        with:
          path: AdaEngine
      - name: Check out the pinned local MCP dependency
        uses: actions/checkout@v4
        with:
          repository: AdaEngine/AdaMCP
          ref: ed7bb9076f9f8c91e2584ca9b7201df0e03defb1
          path: .build-tools/apple-mcp
          persist-credentials: false
      - name: Check out the pinned mobile runtime
        if: matrix.check == 'ipad-simulator'
        run: |
          git init Sloppy
          git -C Sloppy fetch --no-tags --no-recurse-submodules --depth=1 \
            https://github.com/TeamSloppy/Sloppy.git 0d8fd03d0269a480b6af3fb4f40333c319e2c398
          git -C Sloppy checkout --detach FETCH_HEAD
      - name: Build and run the production paths
        working-directory: AdaEngine
        run: bash script/shader_graph_apple_validation.sh '${{ matrix.check }}' "$RUNNER_TEMP/shader-graph-evidence"
      - name: Upload standalone Studio compiler log
        if: always() && matrix.check == 'studio-web'
        uses: actions/upload-artifact@v4
        with:
          name: studio-web-compiler-log
          path: AdaEngine/.build-tools/ada-tool/*/studio-debug-build.log
          if-no-files-found: ignore
      - name: Upload logs and actual frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-graph-${{ matrix.check }}
          path: ${{ runner.temp }}/shader-graph-evidence
          if-no-files-found: error
