name: Ada developer CLI

on:
  pull_request:
    paths:
      - 'ada_tool.py'
      - 'Package.swift'
      - 'script/ada_tools/**'
      - 'script/test_ada_tool.py'
      - 'script/*studio*'
      - 'Tools/ada-toolchain.json'
      - '.github/actions/setup-ubuntu-swift/action.yml'
      - '.github/workflows/ada-tool.yml'
  push:
    branches: [main, develop]
    paths:
      - 'ada_tool.py'
      - 'Package.swift'
      - 'script/ada_tools/**'
      - 'script/test_ada_tool.py'
      - 'script/*studio*'
      - 'Tools/ada-toolchain.json'
      - '.github/actions/setup-ubuntu-swift/action.yml'
      - '.github/workflows/ada-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Swift on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@v0.2.3
        with:
          branch: swift-6.3.1-release
          tag: 6.3.1-RELEASE
      - name: Set up Swift on Ubuntu
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-ubuntu-swift
      - name: Check Swift availability
        run: swift --version
      - name: Test CLI and installation transactions
        run: python script/test_ada_tool.py
